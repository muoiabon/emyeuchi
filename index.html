<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>em yeu chi ♡</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #08060c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* NỀN */

.sky {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 90, 160, 0.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(130, 80, 255, 0.10),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #08060c,
            #120817,
            #08060c
        );
}


/* SAO */

.stars {
    position: fixed;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(255,170,210,.6) 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        150px 150px;

    background-position:
        20px 30px,
        70px 100px;

    opacity: .5;

    animation: starsMove 25s linear infinite;
}

@keyframes starsMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-50px);
    }

}


/* TRĂNG */

.moon {
    position: fixed;

    width: 110px;
    height: 110px;

    top: 10%;
    right: 12%;

    border-radius: 50%;

    background: #fff5f8;

    box-shadow:
        0 0 25px rgba(255,220,235,.6),
        0 0 80px rgba(255,130,190,.25);

    opacity: .9;
}

.moon::after {
    content: "";

    position: absolute;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    background: #0c0710;

    left: -28px;
    top: -10px;
}


/* NỘI DUNG */

.container {

    position: relative;

    width: 100%;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 20px;
}


/* CHỮ */

h1 {

    font-family: Arial, Helvetica, sans-serif;

    font-size: clamp(
        48px,
        12vw,
        100px
    );

    font-weight: 600;

    letter-spacing: 1px;

    color: white;

    text-shadow:
        0 0 12px rgba(255,150,200,.55),
        0 0 35px rgba(255,80,160,.25);

    animation: appear 1.5s ease forwards;
}


/* TIM */

.heart {

    display: inline-block;

    color: #ff80ad;

    margin-left: 8px;

    text-shadow:
        0 0 10px rgba(255,80,150,.8),
        0 0 30px rgba(255,50,140,.45);

    animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.25);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.15);
    }

    60% {
        transform: scale(1);
    }

}


/* HIỆU ỨNG HIỆN */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* TIM BAY */

.floating-heart {

    position: fixed;

    bottom: -30px;

    color: rgba(255,130,180,.55);

    pointer-events: none;

    animation: floatUp linear forwards;
}

@keyframes floatUp {

    from {
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    80% {
        opacity: .5;
    }

    to {
        transform:
            translateY(-110vh)
            translateX(60px)
            rotate(25deg);

        opacity: 0;
    }

}


/* ĐIỆN THOẠI */

@media (max-width: 600px) {

    .moon {

        width: 75px;
        height: 75px;

        top: 9%;
        right: 8%;
    }

    .moon::after {

        width: 75px;
        height: 75px;

        left: -19px;
        top: -7px;
    }

    h1 {

        font-size: clamp(
            42px,
            13vw,
            75px
        );
    }

}

</style>
</head>


<body>

<div class="sky"></div>

<div class="stars"></div>

<div class="moon"></div>


<div class="container">

    <h1>
        em yeu chi
        <span class="heart">♥</span>
    </h1>

</div>


<script>

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className =
        "floating-heart";

    heart.innerHTML =
        Math.random() > 0.5
        ? "♡"
        : "♥";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (10 + Math.random() * 15) + "px";

    heart.style.animationDuration =
        (7 + Math.random() * 7) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 15000);

}

setInterval(createHeart, 1000);

</script>

</body>
</html>
